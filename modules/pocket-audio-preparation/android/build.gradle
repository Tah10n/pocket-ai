plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.github.tah10n.pocketaudio'
version = '0.0.1'
android {
  namespace 'com.github.tah10n.pocketaudio'
  defaultConfig {
    minSdk 24
    versionName '0.0.1'
  }
}
dependencies {
  implementation project(':expo-modules-core')
  testImplementation 'junit:junit:4.13.2'
}
