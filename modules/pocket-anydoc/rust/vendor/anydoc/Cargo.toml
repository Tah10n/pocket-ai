[package]
name = "anydoc"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
description = "Vendored document conversion core for Pocket AI"
license = "MIT"
repository = "https://github.com/firecrawl/anydoc"
publish = false

[dependencies]
calamine = { path = "../calamine", features = ["dates"] }
cfb = "0.14.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = { path = "../pdf-inspector" }
quick-xml = "0.41.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
