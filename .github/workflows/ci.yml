name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  push:
    branches:
      - main

# Prose edits cannot cancel source CI. Push runs and other workflows stay independent.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null) }}

permissions:
  contents: read

jobs:
  metadata:
    name: CI metadata
    if: github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acknowledge metadata update
        run: echo "PR metadata updated. Source CI remains attached to the unchanged revision."

  # Metadata runs use different check names: a skipped job must never replace a
  # failed required verify check on the same SHA. Base edits still exercise CI.
  native-scope:
    name: native scope${{ github.event.action == 'edited' && github.event.changes.base == null && ' (metadata)' || '' }}
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.native == 'true' || startsWith(github.head_ref, 'release-please--') }}
      diagnostics: ${{ steps.qa.outputs.diagnostics }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect release-sensitive native changes
        id: scope
        uses: dorny/paths-filter@v4
        with:
          filters: |
            native:
              - 'app.json'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - 'plugins/**'
              - 'modules/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/android-qa.yml'
              - '.github/workflows/release-please.yml'
              - 'scripts/android-*.js'
              - 'scripts/build-android-release.js'
              - 'scripts/verify-ci-gate-results.js'
              - 'scripts/ci-android-qa-request.js'
              - 'scripts/verify-native-config.js'
              - 'src/design-system/components/ThemeStyleSelector.tsx'
              - 'src/design-system/materials/**'
              - 'src/design-system/themes/**'
              - 'src/components/ui/ChatHeader.tsx'
              - 'src/components/ui/ChatInputBar.tsx'
              - 'src/components/ui/ScreenShell.tsx'
              - 'src/components/ui/TabBarMaterialBackground.tsx'
              - 'src/providers/ThemeProvider.tsx'
              - 'src/services/AndroidQaGenerationEvidence.ts'
              - 'src/services/BackgroundTaskService.ts'
              - 'src/services/NotificationService.ts'
              - 'src/ui/screens/ChatScreen.tsx'
              - 'src/utils/androidBlur.ts'
              - 'src/utils/androidLiquidGlass.ts'
              - 'src/utils/tabBarLayout.ts'
              - 'src/utils/testIds.ts'
              - 'app/(tabs)/_layout.tsx'
              - 'android/**'
              - 'ios/**'

      - name: Detect explicit diagnostic request
        id: qa
        run: node scripts/ci-android-qa-request.js

  deterministic:
    name: deterministic${{ github.event.action == 'edited' && github.event.changes.base == null && ' (metadata)' || '' }}
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache AnyDoc Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/pocket-anydoc/rust -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify (Rust + typecheck + lint + tests)
        run: npm run verify:release

  android-native-release:
    name: android native release (API ${{ matrix.api-level }})${{ github.event.action == 'edited' && github.event.changes.base == null && ' (metadata)' || '' }}
    if: needs.native-scope.outputs.required == 'true'
    needs:
      - native-scope
      - deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api-level: [32, 33, 34, 35]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pinned Rust for Android
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      - name: Build and run native release pack
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SMOKE_APK_VARIANT: release
          POCKET_AI_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: npm run android:scenarios -- --emulator --pack native --apk-variant release --isolated-qa-install --fail-on-skip --bootstrap-screenshot && npm run verify:native-config -- --require-android

      - name: Upload Android native results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-results-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 1
          path: artifacts/android-scenarios/latest-report.json

      - name: Upload Android native diagnostics
        if: failure() || cancelled() || needs.native-scope.outputs.diagnostics == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-native-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            artifacts/android-scenarios/**
            artifacts/bootstrap-logcat.txt

  ios-native-release:
    name: ios native release${{ github.event.action == 'edited' && github.event.changes.base == null && ' (metadata)' || '' }}
    if: needs.native-scope.outputs.required == 'true'
    needs:
      - native-scope
      - deterministic
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NODE_ENV: production
      EAS_BUILD_PROFILE: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup pinned Rust for iOS
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install dependencies
        shell: bash
        run: |
          install_log="$(mktemp)"
          trap 'rm -f "$install_log"' EXIT
          # llama.rn downloads outside npm's fetch retry handling. Retry transient
          # release-host errors without skipping postinstall or checksum checks.
          for attempt in 1 2 3; do
            echo "Installing dependencies (attempt $attempt/3)"
            if npm ci > "$install_log" 2>&1; then
              cat "$install_log"
              exit 0
            else
              install_status=$?
            fi
            cat "$install_log"
            if [[ "$attempt" -eq 3 ]] || ! grep -Eq 'llama\.rn: Download failed for https://github\.com/mybigday/llama\.rn/releases/download/[^[:space:]]+ with status code (429|5[0-9]{2})([^0-9]|$)' "$install_log"; then
              exit "$install_status"
            fi
            echo "::warning::Transient llama.rn native artifact download failure; retrying npm ci."
            sleep "$((attempt * 15))"
          done

      - name: Build AnyDoc iOS
        run: |
          npm run anydoc:setup -- --platform=ios
          npm run anydoc:build:ios

      - name: Generate and verify iOS project
        run: |
          npx expo prebuild --clean --platform ios --no-install
          npm run verify:native-config -- --require-ios

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Compile unsigned release simulator app
        run: >-
          xcodebuild -workspace ios/pocketai.xcworkspace -scheme PocketAI
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  verify:
    name: verify${{ github.event.action == 'edited' && github.event.changes.base == null && ' (metadata)' || '' }}
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null)
    needs:
      - native-scope
      - deterministic
      - android-native-release
      - ios-native-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enforce deterministic and conditional native results
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          NATIVE_SCOPE_RESULT: ${{ needs.native-scope.result }}
          NATIVE_REQUIRED: ${{ needs.native-scope.outputs.required }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          ANDROID_NATIVE_RESULT: ${{ needs.android-native-release.result }}
          IOS_NATIVE_RESULT: ${{ needs.ios-native-release.result }}
        run: node scripts/verify-ci-gate-results.js
