name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-scope:
    name: native scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.native == 'true' || startsWith(github.head_ref, 'release-please--') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect release-sensitive native changes
        id: scope
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - 'app.json'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - 'plugins/**'
              - 'modules/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-please.yml'
              - 'scripts/android-*.js'
              - 'scripts/build-android-release.js'
              - 'scripts/verify-native-config.js'
              - 'src/services/BackgroundTaskService.ts'
              - 'src/services/NotificationService.ts'
              - 'android/**'
              - 'ios/**'

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache AnyDoc Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/pocket-anydoc/rust -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify (Rust + typecheck + lint + tests)
        run: npm run verify:release

  android-native-release:
    name: android native release (API ${{ matrix.api-level }})
    if: needs.native-scope.outputs.required == 'true'
    needs:
      - native-scope
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api-level: [32, 33, 34, 35]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pinned Rust for Android
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      - name: Build and run native release pack
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SMOKE_APK_VARIANT: release
          POCKET_AI_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: npm run android:scenarios -- --emulator --pack native --apk-variant release --isolated-qa-install --fail-on-skip --bootstrap-screenshot && npm run verify:native-config -- --require-android

      - name: Upload Android native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-native-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            artifacts/android-scenarios/**
            artifacts/bootstrap-logcat.txt

  ios-native-release:
    name: ios native release
    if: needs.native-scope.outputs.required == 'true'
    needs:
      - native-scope
      - verify
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NODE_ENV: production
      EAS_BUILD_PROFILE: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup pinned Rust for iOS
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install dependencies
        run: npm ci

      - name: Build AnyDoc iOS
        run: |
          npm run anydoc:setup -- --platform=ios
          npm run anydoc:build:ios

      - name: Generate and verify iOS project
        run: |
          npx expo prebuild --clean --platform ios --no-install
          npm run verify:native-config -- --require-ios

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Compile unsigned release simulator app
        run: >-
          xcodebuild -workspace ios/pocketai.xcworkspace -scheme PocketAI
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  android-qa:
    name: android (qa)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.labels.*.name, 'run-android-checks') ||
        contains(github.event.pull_request.labels.*.name, 'run-android-scenarios') ||
        contains(github.event.pull_request.labels.*.name, 'android-pack-all') ||
        contains(github.event.pull_request.labels.*.name, 'android-pack-documents') ||
        contains(github.event.pull_request.labels.*.name, 'android-pack-native') ||
        contains(github.event.pull_request.labels.*.name, 'android-pack-runtime') ||
        contains(github.event.pull_request.labels.*.name, 'android-pack-dependency-ui') ||
        contains(github.event.pull_request.labels.*.name, 'android-pack-catalog') ||
        contains(github.event.pull_request.labels.*.name, 'android-pack-extended') ||
        contains(github.event.pull_request.body, '- [x] Run Android checks') ||
        contains(github.event.pull_request.body, '- [X] Run Android checks') ||
        contains(github.event.pull_request.body, '- [x] Run Android document pack') ||
        contains(github.event.pull_request.body, '- [X] Run Android document pack') ||
        contains(github.event.pull_request.body, '- [x] Run Android scenarios') ||
        contains(github.event.pull_request.body, '- [X] Run Android scenarios')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pinned Rust for Android
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache AnyDoc Android dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/pocket-anydoc/rust -> target

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Select Android QA pack
        shell: bash
        run: |
          pack="runtime"

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'android-pack-all') }}" == "true" ]]; then
            pack="all"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'android-pack-documents') || contains(github.event.pull_request.body, '- [x] Run Android document pack') || contains(github.event.pull_request.body, '- [X] Run Android document pack') }}" == "true" ]]; then
            pack="documents"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'android-pack-native') }}" == "true" ]]; then
            pack="native"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'android-pack-runtime') }}" == "true" ]]; then
            pack="runtime"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'android-pack-dependency-ui') }}" == "true" ]]; then
            pack="dependency-ui"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'android-pack-catalog') }}" == "true" ]]; then
            pack="catalog"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'android-pack-extended') || contains(github.event.pull_request.labels.*.name, 'run-android-scenarios') || contains(github.event.pull_request.body, '- [x] Run Android scenarios') || contains(github.event.pull_request.body, '- [X] Run Android scenarios') }}" == "true" ]]; then
            pack="extended"
          fi

          echo "ANDROID_QA_PACK=$pack" >> "$GITHUB_ENV"
          echo "Selected Android QA pack: $pack"

      - name: Install dependencies
        run: npm ci

      - name: Run Android scenarios
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_SMOKE_APK_VARIANT: release
          POCKET_AI_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: npm run android:scenarios -- --emulator --pack "$ANDROID_QA_PACK" --fail-on-skip --bootstrap-screenshot

      - name: Upload Android QA diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-qa
          if-no-files-found: warn
          retention-days: 1
          path: |
            artifacts/android-scenarios/**
            artifacts/bootstrap-logcat.txt

      - name: Upload Android QA APK
        if: >-
          success() &&
          (contains(github.event.pull_request.labels.*.name, 'android-pack-all') ||
           contains(github.event.pull_request.labels.*.name, 'android-pack-documents'))
        uses: actions/upload-artifact@v7
        with:
          name: android-qa-apk
          if-no-files-found: error
          retention-days: 1
          path: android/app/build/outputs/apk/release/app-release.apk

