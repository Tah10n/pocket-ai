[package]
name = "pocket-anydoc"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[lib]
name = "pocket_anydoc"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anydoc = { path = "vendor/anydoc" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
libc = "0.2.177"
log = { version = "0.4.33", features = ["release_max_level_off"] }
pdf-inspector = { path = "vendor/pdf-inspector" }
quick-xml = "0.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12.0"
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
calamine = { path = "vendor/calamine" }
cfb = "0.14.0"
lopdf = { version = "=0.42.0", default-features = false }
tempfile = "3.23.0"

[patch.crates-io]
lopdf = { path = "vendor/lopdf" }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
