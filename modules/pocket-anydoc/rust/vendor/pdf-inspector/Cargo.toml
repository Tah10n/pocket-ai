[package]
name = "pdf-inspector"
version = "0.1.7"
edition = "2021"
authors = ["Firecrawl Team"]
description = "Vendored PDF inspection core for Pocket AI"
license = "MIT"
repository = "https://github.com/firecrawl/pdf-inspector"
publish = false

[lib]
name = "pdf_inspector"
crate-type = ["lib"]

[dependencies]
base64 = "0.22.1"
thiserror = "2.0"
log = "0.4"
regex = "1.10"
once_cell = "1.19"
unicode-normalization = "0.1"
ttf-parser = "0.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["rayon"] }
rayon = "1.10"
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }

[features]
default = []
cli = ["dep:env_logger"]
python = []

[[bin]]
name = "detect_pdf"
path = "src/bin/detect_pdf.rs"
required-features = ["cli"]

[[bin]]
name = "dump_ops"
path = "src/bin/dump_ops.rs"
required-features = ["cli"]

[[bin]]
name = "pdf2md"
path = "src/bin/pdf2md.rs"
required-features = ["cli"]
